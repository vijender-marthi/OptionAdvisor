<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Journal</title>
<style>
:root{
  --bg:#080b10; --card:#161b22; --border:#21262d;
  --text:#e6edf3; --muted:#8b949e;
  --green:#3fb950; --red:#f85149; --yellow:#d29922;
  --blue:#58a6ff; --purple:#bc8cff;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
body.day{--accent:#58a6ff; --accent-dim:rgba(88,166,255,.12);}
body.swing{--accent:#bc8cff; --accent-dim:rgba(188,140,255,.12);}
*{box-sizing:border-box; margin:0; padding:0;}
body{background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;}
button{font:inherit; cursor:pointer;}
input,select,textarea{font:inherit; background:#0d1117; color:var(--text); border:1px solid var(--border); border-radius:6px; padding:6px 8px;}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--accent);}
.num{font-family:var(--mono);}

/* ---------- Header ---------- */
header{position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:16px; padding:10px 20px; background:rgba(8,11,16,.95); backdrop-filter:blur(6px); border-bottom:1px solid var(--border);}
header h1{font-size:17px; font-weight:700; letter-spacing:.3px; white-space:nowrap;}
.mode-toggle{display:flex; gap:6px;}
.mode-btn{padding:5px 16px; border-radius:999px; border:1px solid var(--border); background:transparent; color:var(--muted); font-size:12px; font-weight:700; letter-spacing:.6px; transition:all .2s;}
.mode-btn.active-day{border-color:var(--blue); color:var(--blue); background:rgba(88,166,255,.1);}
.mode-btn.active-swing{border-color:var(--purple); color:var(--purple); background:rgba(188,140,255,.1);}
#clock{margin-left:auto; font-family:var(--mono); font-size:14px; color:var(--muted);}
.pnl-badge{font-family:var(--mono); font-size:13px; font-weight:700; padding:4px 12px; border-radius:999px; border:1px solid;}
.pnl-pos{color:var(--green); border-color:rgba(63,185,80,.4); background:rgba(63,185,80,.08);}
.pnl-neg{color:var(--red); border-color:rgba(248,81,73,.4); background:rgba(248,81,73,.08);}
#exportBtn{padding:5px 14px; border-radius:6px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:12px;}
#exportBtn:hover{border-color:var(--accent);}

/* ---------- Layout ---------- */
.layout{display:flex; align-items:flex-start;}
aside{width:280px; flex:0 0 280px; padding:14px; border-right:1px solid var(--border); position:sticky; top:53px; height:calc(100vh - 53px); overflow-y:auto;}
main{flex:1; min-width:0; padding:16px 20px 60px;}

/* ---------- Sidebar ---------- */
.side-h{font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--muted); margin:18px 0 8px;}
.side-h:first-child{margin-top:0;}
.wl-card{background:var(--card); border:1px solid var(--border); border-radius:8px; padding:9px 11px; margin-bottom:7px; cursor:pointer; transition:border-color .15s;}
.wl-card:hover{border-color:var(--accent);}
.wl-card.active{border-color:var(--accent); background:var(--accent-dim);}
.wl-top{display:flex; align-items:center; gap:7px;}
.bias-dot{width:8px; height:8px; border-radius:50%; flex:0 0 8px;}
.wl-tick{font-family:var(--mono); font-weight:700; font-size:14px;}
.wl-px{margin-left:auto; font-family:var(--mono); font-size:13px;}
.wl-sub{display:flex; justify-content:space-between; margin-top:3px; font-size:11.5px; color:var(--muted);}
.wl-sub .num{font-size:11.5px;}
.add-btn{width:100%; padding:7px; border-radius:8px; border:1px dashed var(--border); background:transparent; color:var(--muted); font-size:12px;}
.add-btn:hover{border-color:var(--accent); color:var(--accent);}
.pulse-row{background:var(--card); border:1px solid var(--border); border-radius:8px; padding:8px 11px; margin-bottom:6px; cursor:pointer;}
.pulse-row:hover{border-color:var(--accent);}
.pulse-top{display:flex; justify-content:space-between; font-family:var(--mono); font-size:13px; font-weight:600;}
.pulse-note{font-size:11.5px; color:var(--muted); margin-top:2px;}
.side-stat{display:flex; justify-content:space-between; font-size:12.5px; padding:3px 0;}
.side-stat .num{font-weight:600;}
.side-box{background:var(--card); border:1px solid var(--border); border-radius:8px; padding:10px 12px;}

/* ---------- Tabs ---------- */
#tabs{display:flex; gap:4px; margin-bottom:18px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
.tab-btn{padding:8px 16px; background:transparent; border:none; border-bottom:2px solid transparent; color:var(--muted); font-size:13px; font-weight:600;}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--accent); border-bottom-color:var(--accent);}

/* ---------- Cards / common ---------- */
.card{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:16px;}
.card h3{font-size:13px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--muted); margin-bottom:12px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
@media(max-width:1100px){.grid2,.grid3{grid-template-columns:1fr;}}
.pos{color:var(--green);} .neg{color:var(--red);} .neu{color:var(--yellow);}
.pill{display:inline-block; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:700; letter-spacing:.5px;}
.pill-green{background:rgba(63,185,80,.15); color:var(--green); border:1px solid rgba(63,185,80,.35);}
.pill-red{background:rgba(248,81,73,.15); color:var(--red); border:1px solid rgba(248,81,73,.35);}
.pill-yellow{background:rgba(210,153,34,.15); color:var(--yellow); border:1px solid rgba(210,153,34,.35);}
.pill-blue{background:rgba(88,166,255,.15); color:var(--blue); border:1px solid rgba(88,166,255,.35);}
.pill-purple{background:rgba(188,140,255,.15); color:var(--purple); border:1px solid rgba(188,140,255,.35);}

/* hero */
.hero-head{display:flex; align-items:baseline; gap:14px; margin-bottom:14px; flex-wrap:wrap;}
.hero-tick{font-family:var(--mono); font-size:26px; font-weight:800;}
.hero-px{font-family:var(--mono); font-size:24px; font-weight:600;}
.hero-chg{font-family:var(--mono); font-size:15px; font-weight:600;}
.stat-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px;}
.stat{background:#0d1117; border:1px solid var(--border); border-radius:8px; padding:8px 11px;}
.stat .lbl{font-size:10.5px; letter-spacing:.6px; text-transform:uppercase; color:var(--muted);}
.stat .val{font-family:var(--mono); font-size:15px; font-weight:600; margin-top:2px;}
.stat .sub{font-size:11px; color:var(--muted); margin-top:1px;}

/* checklist */
.check-item{display:flex; gap:10px; padding:9px 12px; border:1px solid var(--border); border-radius:8px; margin-bottom:7px; cursor:pointer; transition:background .2s,border-color .2s; background:#0d1117;}
.check-item:hover{border-color:var(--accent);}
.check-item.done{background:rgba(63,185,80,.1); border-color:rgba(63,185,80,.35);}
.check-item.done .ck-text{text-decoration:line-through; color:var(--muted);}
.ck-box{width:18px; height:18px; flex:0 0 18px; border:1.5px solid var(--muted); border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--green); margin-top:1px;}
.check-item.done .ck-box{border-color:var(--green); background:rgba(63,185,80,.2);}
.ck-text{font-size:13px; font-weight:500;}
.ck-note{font-size:11.5px; color:var(--muted); margin-top:2px;}
.progress{height:8px; background:#0d1117; border:1px solid var(--border); border-radius:999px; overflow:hidden; margin-top:12px;}
.progress > div{height:100%; border-radius:999px; transition:width .45s ease, background .45s;}
.prog-lbl{font-size:11.5px; color:var(--muted); margin-top:5px; font-family:var(--mono);}

/* OR visual */
.or-visual{display:flex; gap:20px; align-items:stretch; flex-wrap:wrap;}
.or-bar-wrap{position:relative; width:170px; flex:0 0 170px; height:240px; margin:10px 0 10px 6px;}
.or-track{position:absolute; left:60px; top:0; bottom:0; width:14px; background:#0d1117; border:1px solid var(--border); border-radius:7px;}
.or-zone{position:absolute; left:60px; width:14px; border-radius:4px;}
.or-mark{position:absolute; left:0; right:0; height:0;}
.or-mark .line{position:absolute; left:52px; width:30px; border-top:2px solid; top:0;}
.or-mark .tag{position:absolute; left:88px; top:-9px; font-family:var(--mono); font-size:11px; white-space:nowrap;}
.or-mark .tagl{position:absolute; right:118px; top:-9px; font-family:var(--mono); font-size:11px; white-space:nowrap; text-align:right;}

/* key levels */
.lvl-row{display:flex; align-items:center; gap:12px; padding:7px 12px; border-bottom:1px solid var(--border); font-size:13px;}
.lvl-row:last-child{border-bottom:none;}
.lvl-row.is-close{background:var(--accent-dim); border-radius:6px;}
.lvl-px{font-family:var(--mono); font-weight:700; width:90px;}
.lvl-name{font-weight:600; width:160px;}
.lvl-note{color:var(--muted); font-size:12px; flex:1;}

/* drill / boxes */
.drill{border:1px solid rgba(210,153,34,.45); background:rgba(210,153,34,.07); border-radius:10px; padding:14px 16px; margin-bottom:16px;}
.drill h3{color:var(--yellow);}
.danger-box{border:1px solid rgba(248,81,73,.45); background:rgba(248,81,73,.06); border-radius:10px; padding:14px 16px; margin-bottom:16px;}
.danger-box h3{color:var(--red);}
.ok-box{border:1px solid rgba(63,185,80,.45); background:rgba(63,185,80,.06); border-radius:10px; padding:14px 16px; margin-bottom:16px;}
.ok-box h3{color:var(--green);}
.drill-step{display:flex; gap:10px; padding:5px 0; font-size:13px;}
.drill-num{font-family:var(--mono); font-weight:700; color:var(--yellow); flex:0 0 22px;}

/* scenarios */
.scen-card{border-radius:10px; padding:16px; border:1px solid var(--border); background:var(--card); display:flex; flex-direction:column;}
.scen-bull{border-top:3px solid var(--green);}
.scen-bear{border-top:3px solid var(--red);}
.scen-flat{border-top:3px solid var(--yellow);}
.scen-title{font-size:14px; font-weight:800; letter-spacing:.5px; margin-bottom:2px;}
.scen-sub{font-size:11.5px; color:var(--muted); margin-bottom:10px;}
.scen-row{display:flex; justify-content:space-between; gap:10px; padding:5px 0; border-bottom:1px dashed var(--border); font-size:12.5px;}
.scen-row:last-of-type{border-bottom:none;}
.scen-row .k{color:var(--muted);}
.scen-row .v{font-family:var(--mono); font-weight:600; text-align:right;}
.action-box{margin-top:auto; padding:9px 11px; border-radius:8px; font-size:12px; margin-top:12px;}
.action-bull{background:rgba(63,185,80,.08); border:1px solid rgba(63,185,80,.3);}
.action-bear{background:rgba(248,81,73,.08); border:1px solid rgba(248,81,73,.3);}
.action-flat{background:rgba(210,153,34,.08); border:1px solid rgba(210,153,34,.3);}

/* decision tree */
.tree-step{display:flex; gap:12px; align-items:flex-start;}
.tree-node{flex:1; background:#0d1117; border:1px solid var(--border); border-radius:8px; padding:9px 13px; font-size:12.5px;}
.tree-node b{color:var(--accent);}
.tree-arrow{text-align:center; color:var(--muted); font-size:14px; padding:2px 0 2px 30px;}
.tree-n{flex:0 0 26px; height:26px; border-radius:50%; background:var(--accent-dim); border:1px solid var(--accent); color:var(--accent); font-family:var(--mono); font-weight:700; font-size:12px; display:flex; align-items:center; justify-content:center; margin-top:4px;}

/* trade table */
table{width:100%; border-collapse:collapse; font-size:12.5px;}
th{text-align:left; font-size:10.5px; letter-spacing:.7px; text-transform:uppercase; color:var(--muted); padding:7px 9px; border-bottom:1px solid var(--border);}
td{padding:8px 9px; border-bottom:1px solid var(--border); vertical-align:top;}
tr:last-child td{border-bottom:none;}
.form-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px;}
.form-grid label{display:block; font-size:10.5px; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); margin-bottom:3px;}
.form-grid input,.form-grid select{width:100%;}
.btn-accent{padding:8px 18px; border-radius:6px; border:1px solid var(--accent); background:var(--accent-dim); color:var(--accent); font-weight:700; font-size:13px;}
.btn-accent:hover{filter:brightness(1.2);}

/* rules */
.rule-cat{margin-bottom:18px;}
.rule-cat-h{display:flex; justify-content:space-between; align-items:center; font-size:12px; font-weight:700; letter-spacing:.7px; text-transform:uppercase; color:var(--muted); margin-bottom:8px;}
.score-big{font-family:var(--mono); font-size:34px; font-weight:800;}
.truth{border-left:3px solid var(--border); padding:8px 14px; margin-bottom:12px;}
.truth .lie{font-size:13px; font-style:italic; color:var(--yellow);}
.truth .fact{font-size:12.5px; color:var(--muted); margin-top:4px;}
.truth .fact b{color:var(--text);}

/* matrix */
.matrix{display:grid; grid-template-columns:90px repeat(4,1fr); gap:6px; font-size:11.5px;}
.mx-h{font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; font-size:10.5px; display:flex; align-items:center; justify-content:center; text-align:center;}
.mx-row-h{font-weight:700; display:flex; align-items:center; font-size:11px; color:var(--muted); text-transform:uppercase;}
.mx-cell{border-radius:8px; padding:8px 9px; border:1px solid;}
.mx-best{background:rgba(63,185,80,.1); border-color:rgba(63,185,80,.4);}
.mx-best .mx-lbl{color:var(--green);}
.mx-ok{background:rgba(210,153,34,.08); border-color:rgba(210,153,34,.35);}
.mx-ok .mx-lbl{color:var(--yellow);}
.mx-risky{background:rgba(248,81,73,.06); border-color:rgba(210,153,34,.45);}
.mx-risky .mx-lbl{color:var(--yellow);}
.mx-avoid{background:rgba(248,81,73,.1); border-color:rgba(248,81,73,.4);}
.mx-avoid .mx-lbl{color:var(--red);}
.mx-lbl{font-weight:800; letter-spacing:.5px; font-size:11px;}
.mx-why{color:var(--muted); margin-top:2px; font-size:11px;}

/* sectors */
.sector-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
@media(max-width:1100px){.sector-grid{grid-template-columns:repeat(2,1fr);}}
.sector-card{background:#0d1117; border:1px solid var(--border); border-radius:8px; padding:9px 11px;}
.sector-card.hot{border-color:var(--accent); background:var(--accent-dim);}
.sector-top{display:flex; justify-content:space-between; font-family:var(--mono); font-weight:700; font-size:13px;}
.sector-sub{display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-top:3px;}

/* notes */
.note-field{margin-bottom:10px;}
.note-field label{display:block; font-size:11px; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); margin-bottom:4px;}
.note-field input,.note-field textarea,.note-field select{width:100%;}
textarea{resize:vertical; min-height:54px;}

/* confidence */
.conf-meter{height:14px; background:#0d1117; border:1px solid var(--border); border-radius:999px; overflow:hidden;}
.conf-meter>div{height:100%; transition:width .45s ease;}
.conf-zones{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:12px; font-size:12px;}
.conf-zone{border-radius:8px; padding:8px 10px; border:1px solid var(--border); background:#0d1117;}
.conf-zone.active-zone{border-color:var(--accent); background:var(--accent-dim);}

.muted{color:var(--muted);}
.small{font-size:12px;}
.mb0{margin-bottom:0;}
.flex-between{display:flex; justify-content:space-between; align-items:center;}
.del-x{background:none; border:none; color:var(--muted); font-size:14px; padding:2px 6px;}
.del-x:hover{color:var(--red);}
</style>
</head>
<body class="day">

<header>
  <h1>Trade Journal</h1>
  <div class="mode-toggle">
    <button class="mode-btn" id="btnDay" data-act="mode" data-mode="day">DAY TRADE</button>

  </div>
  <div id="clock" class="num"></div>
  <div class="pnl-badge" id="pnlBadge"></div>
  <button id="exportBtn" data-act="export">&#11015; Export</button>
</header>

<div class="layout">
  <aside id="sidebar"></aside>
  <main>
    <nav id="tabs"></nav>
    <div id="content"></div>
  </main>
</div>

/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const T = () => tickers[state.ticker];
const fmt = (n,d=2) => n==null ? "—" : Number(n).toFixed(d);
const money = n => (n<0?"-$":"+$")+Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",");
const pctCls = n => n>0?"pos":(n<0?"neg":"neu");
const sign = n => (n>0?"+":"")+fmt(n);
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function chgOf(t){ const d=t.close-t.prevClose; return {d, p:d/t.prevClose*100}; }
function tradePnl(tr){ return (tr.dir==="SHORT" ? tr.entry-tr.exit : tr.exit-tr.entry)*tr.size; }
function sessionPnl(){ return trades.reduce((a,t)=>a+tradePnl(t),0); }
function winRate(){ if(!trades.length) return 0; return trades.filter(t=>tradePnl(t)>0).length/trades.length*100; }
function ivrEnv(ivr){ return ivr<35?"LOW":(ivr<=60?"MID":"HIGH"); }
function ivrLabel(ivr){ return ivr<35?"BUY OPTIONS":(ivr<=60?"USE SPREADS":"SELL PREMIUM"); }
function rsiZone(r){ return r<30?"oversold":r<40?"weak":r<60?"neutral":r<70?"strong":"overbought"; }
function biasColor(b){ return b==="bull"?"var(--green)":b==="bear"?"var(--red)":"var(--yellow)"; }
function probs(bias){ return bias==="bull"?{bull:50,bear:20,flat:30}:bias==="bear"?{bull:20,bear:50,flat:30}:{bull:30,bear:30,flat:40}; }
function checked(listId){ const c=state.checks[listId]||{}; return CHECKLISTS[listId].reduce((a,_,i)=>a+(c[i]?1:0),0); }
function scoreColor(p){ return p>=80?"var(--green)":p>=60?"var(--yellow)":"var(--red)"; }

function checklistHTML(listId, title){
  const items = CHECKLISTS[listId];
  const done = state.checks[listId]||{};
  const n = checked(listId), pct = Math.round(n/items.length*100);
  return `<div class="card"><h3>${title}</h3>
    ${items.map(([txt,note],i)=>`
      <div class="check-item ${done[i]?"done":""}" data-act="check" data-list="${listId}" data-idx="${i}">
        <div class="ck-box">${done[i]?"✓":""}</div>
        <div><div class="ck-text">${txt}</div>${note?`<div class="ck-note">${note}</div>`:""}</div>
      </div>`).join("")}
    <div class="progress"><div id="prog-${listId}" style="width:${pct}%;background:${scoreColor(pct)}"></div></div>
    <div class="prog-lbl" id="proglbl-${listId}">${n} / ${items.length} complete — ${pct}%</div>
  </div>`;
}

function updateChecklistUI(listId){
  const items = CHECKLISTS[listId];
  const n = checked(listId), pct = Math.round(n/items.length*100);
  const bar = document.getElementById("prog-"+listId);
  if(bar){ bar.style.width = pct+"%"; bar.style.background = scoreColor(pct); }
  const lbl = document.getElementById("proglbl-"+listId);
  if(lbl) lbl.textContent = `${n} / ${items.length} complete — ${pct}%`;
  if(listId.endsWith("rules")) renderMain(); // rules tab shows score breakdowns
}

function noteField(key, label, placeholder, kind){
  const v = esc(state.notes[key]||"");
  if(kind==="textarea") return `<div class="note-field"><label>${label}</label><textarea data-note="${key}" placeholder="${placeholder}">${v}</textarea></div>`;
  return `<div class="note-field"><label>${label}</label><input data-note="${key}" placeholder="${placeholder}" value="${v}"></div>`;
}

function levelsHTML(levels, close){
  const rows = levels.filter(l=>l.v!=null).sort((a,b)=>b.v-a.v);
  return rows.map(l=>{
    const isClose = l.name.startsWith("Close");
    const cls = isClose ? "is-close" : "";
    const col = isClose ? "var(--accent)" : (l.v>close ? "var(--red)" : "var(--green)");
    return `<div class="lvl-row ${cls}">
      <span class="lvl-px" style="color:${col}">${fmt(l.v)}</span>
      <span class="lvl-name">${l.name}</span>

  }).join("");
}

function orVisualHTML(t){
  const vals = [t.orHigh,t.orLow,t.vwap,t.close,t.orMid];
  const hi = Math.max(...vals), lo = Math.min(...vals);
  const pad = (hi-lo)*0.12 || 1;
  const top = hi+pad, bot = lo-pad, span = top-bot;
  const y = v => ((top-v)/span*100);
  const lean = t.vwap >= t.orMid;
  const leanColor = lean ? "var(--green)" : "var(--red)";
  const zoneTop = y(t.orHigh), zoneBot = y(t.orLow);
  const mark = (v,color,label,left) => `
    <div class="or-mark" style="top:${y(v)}%">
      <div class="line" style="border-color:${color}"></div>
      ${left
        ? `<div class="tagl" style="color:${color}">${label} ${fmt(v)}</div>`
        : `<div class="tag" style="color:${color}">${label} ${fmt(v)}</div>`}
    </div>`;
  return `<div class="or-visual">
    <div class="or-bar-wrap">
      <div class="or-track"></div>
      <div class="or-zone" style="top:${zoneTop}%;height:${zoneBot-zoneTop}%;background:${lean?"rgba(63,185,80,.18)":"rgba(248,81,73,.18)"}"></div>
      ${mark(t.orHigh,"var(--muted)","ORH",false)}
      ${mark(t.orMid,"var(--yellow)","OR Mid",false)}
      ${mark(t.orLow,"var(--muted)","ORL",false)}
      ${mark(t.vwap,"var(--blue)","VWAP",true)}
      ${mark(t.close,"var(--text)","Close",true)}
    </div>
    <div style="flex:1;min-width:200px">
      <div style="font-weight:800;font-size:15px;color:${leanColor};margin-bottom:6px">
        ${lean ? "BULLISH LEAN" : "BEARISH LEAN"} — VWAP ${lean?"above":"below"} OR Mid
      </div>
      <p class="small muted" style="margin-bottom:8px">
        VWAP at <span class="num">${fmt(t.vwap)}</span> sits ${lean?"above":"below"} the OR midpoint at
        <span class="num">${fmt(t.orMid)}</span>. The average dollar traded today changed hands
        ${lean?"above":"below"} the middle of the opening range — ${lean?"buyers":"sellers"} controlled the auction.
      </p>
      <p class="small muted" style="margin-bottom:8px">
        <b style="color:var(--text)">For tomorrow:</b> ${lean
          ? "lean long. Favor the bull scenario on a break of ORH; treat ORL breakdowns with suspicion unless volume confirms."
          : "lean short. Favor the bear scenario on a break of ORL; treat ORH breakouts with suspicion unless volume confirms."}
        Close at <span class="num">${fmt(t.close)}</span> ${t.close>=t.vwap?"above":"below"} VWAP confirms the read.
      </p>
      <div class="small num" style="color:var(--muted);border:1px dashed var(--border);border-radius:6px;padding:6px 10px;display:inline-block">
        OR Mid = (ORH + ORL) ÷ 2 = (${fmt(t.orHigh)} + ${fmt(t.orLow)}) ÷ 2 = ${fmt(t.orMid)}
      </div>
    </div>
  </div>`;
}

/* ================= SCENARIOS (shared math) ================= */
function dayScenarios(t){
  const p = probs(t.bias);
  const bullEntry = t.orHigh+Math.max(t.orHigh*0.0005,0.05);
  const bullStop = t.orMid;
  const bullR = bullEntry-bullStop;
  const bearEntry = t.orLow-Math.max(t.orLow*0.0005,0.05);
  const bearStop = t.orMid;
  const bearR = bearStop-bearEntry;
  return {
    bull:{trigger:`5m close above ORH ${fmt(t.orHigh)}`, entry:bullEntry, stop:bullStop,
      t1:bullEntry+bullR, t2:bullEntry+2*bullR, rr:"1 : 2", prob:p.bull},
    bear:{trigger:`5m close below ORL ${fmt(t.orLow)}`, entry:bearEntry, stop:bearStop,
      t1:bearEntry-bearR, t2:bearEntry-2*bearR, rr:"1 : 2", prob:p.bear},
    flat:{trigger:`No 5m close beyond ORH ${fmt(t.orHigh)} or ORL ${fmt(t.orLow)} by 7:30`, prob:p.flat}
  };
}

function swingStory(t){

    : `on light volume (${fmt(t.volRatio,2)}×) — the move lacks conviction`;
  const ctrl = !aboveMa20 && t.structure==="LL/LH" ? "Bears in control."
    : aboveMa20 && t.structure==="HH/HL" ? "Bulls in control."
    : "Control is contested — wait for the next decisive close.";
  return `Closed ${aboveMa20?"above":"below"} MA20 (${fmt(t.ma20)}) ${volTxt}. ` +
    `MACD shows a ${t.macd}. Daily RSI at ${t.rsiDaily} (${rsiZone(t.rsiDaily)}), structure ${t.structure}, weekly trend ${t.weeklyTrend}. ` +
    `${ctrl} ${aboveMa50?`MA50 at ${fmt(t.ma50)} is the support that matters below.`:`Price is below MA50 (${fmt(t.ma50)}) — the bigger trend is broken too.`}`;
}

/* ================= SWING: SCENARIOS ================= */
function swingScenarios(t){
  const p = probs(t.bias);
  const maRef = t.close>=t.ma20 ? t.ma20 : Math.min(t.ma20,t.priorDayHigh);
  // Bull: reclaim + pullback entry at MA20 (or prior day high if reclaimed above)
  const bullEntry = t.ma20;
  const bullStop = Math.min(t.priorDayLow, t.ma20*0.985);
  const bullT1 = t.priorDayHigh;
  const bullT2 = t.priorWeekHigh;
  const bullRR = (bullT1-bullEntry)/(bullEntry-bullStop);
  // Bear: rejection at MA20/prior-day-high zone or breakdown of prior day low
  const bearEntry = t.priorDayLow;
  const bearStop = Math.min(t.ma20*1.005, t.priorDayHigh);
  const bearT1 = Math.min(t.dayLow, t.priorWeekLow*1.01);
  const bearT2 = t.priorWeekLow < bearT1 ? t.priorWeekLow : bearT1*0.97;
  const bearRR = (bearEntry-bearT1)/(bearStop-bearEntry);
  return {
    bull:{trigger:`Daily close back above MA20 ${fmt(t.ma20)}, then pullback that holds it`,
      entry:bullEntry, stop:bullStop, t1:bullT1, t2:bullT2, rr:"1 : "+fmt(Math.max(bullRR,0.1),1), prob:p.bull},
    bear:{trigger:`Rejection candle at MA20 ${fmt(t.ma20)} zone, or break of prior day low ${fmt(t.priorDayLow)}`,
      entry:bearEntry, stop:bearStop, t1:bearT1, t2:bearT2, rr:"1 : "+fmt(Math.max(bearRR,0.1),1), prob:p.bear},
    flat:{trigger:`Price pinned between prior day low ${fmt(t.priorDayLow)} and MA20 ${fmt(t.ma20)} on shrinking volume`, prob:p.flat}
  };
}

      ${scenRows(s.bear,false)}
      ${probBar(s.bear.prob,"var(--red)")}
      <div class="action-box action-bear"><b>Action guide:</b> wait for the rejection candle at resistance before entering. Do not short into support at ${fmt(t.ma50)} — that's where shorts get squeezed, not paid.</div>
    </div>
    <div class="scen-card scen-flat">
      <div class="scen-title neu">NEUTRAL / CHOP</div><div class="scen-sub">No edge between the levels</div>
      <div class="scen-row"><span class="k">Trigger</span><span class="v" style="text-align:right;max-width:60%">${s.flat.trigger}</span></div>
      <div class="scen-row"><span class="k">Action</span><span class="v">NO TRADE</span></div>
      ${probBar(s.flat.prob,"var(--yellow)")}
      <div class="action-box action-flat"><b>Middle of the range is the no-trade zone.</b> Entries belong at levels. Let it pick a side on the daily close — you lose nothing by waiting a day on a 3–10 day hold.</div>
    </div>
  </div>
  <div class="drill"><h3>Honest Rule</h3>
    <p class="small">If you can't write the scenario — trigger, entry, stop, target, in numbers — <b>you don't understand the trade.</b>
    A scenario you can't write down is a feeling, and feelings pay commissions, not traders.</p>
  </div>`;
}

/* ================= SWING: OPTIONS PLAN ================= */
function swingOptionsTab(){
  const t = T();
  const env = ivrEnv(t.ivr);
  const dirWord = t.bias==="bear"?"puts":"calls";
  const recs = {
    LOW:{type:`Buy ATM ${dirWord} direct`, dte:"10–14 DTE",
      why:"IV is cheap — you're buying premium at a discount. Long options carry the most edge when volatility expands in your favor."},
    MID:{type:`${t.bias==="bear"?"Put":"Call"} debit spread (buy ATM, sell 1 strike ${t.bias==="bear"?"lower":"higher"})`, dte:"14 DTE",
      why:"IV is middling — the short leg subsidizes the inflated premium you're paying on the long leg. You cap upside to cut the IV tax."},
    HIGH:{type:`Sell premium — ${t.bias==="bear"?"call":"put"} credit spread ${t.bias==="bear"?"above resistance":"below support"}`, dte:"14–21 DTE",
      why:"IV is rich — buying here means paying panic prices. Selling defined-risk spreads makes the fat premium work for you instead."}
  };
  const rec = recs[env];
  const envCards = [
    ["LOW","IVR < 35","Buy ATM calls or puts direct, 10–14 DTE","Premium is cheap. Long options have the best payoff profile."],
    ["MID","IVR 35–60","Use debit spreads, 14 DTE","Offset inflated premium by selling a further strike against your long."],
    ["HIGH","IVR 60+","Sell premium — credit spreads, 14–21 DTE","Volatility is overpriced. Be the casino, not the gambler."]
  ];
  const earnWarn = t.earningsDays!=null && t.earningsDays<=21;
  return `
  <div class="card"><h3>IV Environment — ${state.ticker} IVR ${t.ivr} (${env})</h3>
    <div class="grid3">
      ${envCards.map(([k,rng,strat,why])=>`
        <div class="conf-zone ${env===k?"active-zone":""}">
          <b style="color:${k==="LOW"?"var(--green)":k==="MID"?"var(--yellow)":"var(--red)"}">${k} — ${rng}</b>
          <div style="margin-top:4px;font-weight:600">${strat}</div>
          <div class="muted small" style="margin-top:3px">${why}</div>
        </div>`).join("")}
    </div>
  </div>
  <div class="card"><h3>Recommended Structure — ${state.ticker}</h3>
    <div class="stat-grid">
      <div class="stat"><div class="lbl">Option Type</div><div class="val" style="font-size:13px">${rec.type}</div></div>
      <div class="stat"><div class="lbl">DTE Range</div><div class="val">${rec.dte}</div></div>
      <div class="stat"><div class="lbl">Bias</div><div class="val ${t.bias==="bear"?"neg":"pos"}" style="text-transform:uppercase">${t.bias}</div></div>
    </div>
    <p class="small muted" style="margin-top:10px"><b style="color:var(--text)">Why this fits:</b> ${rec.why}</p>
  </div>
  <div class="card"><h3>IV + DTE Combo Matrix</h3>
    <div class="matrix">
      <div></div>${MATRIX.cols.map(c=>`<div class="mx-h">${c}</div>`).join("")}
      ${MATRIX.rows.map((r,ri)=>`
        <div class="mx-row-h">${r}</div>
        ${MATRIX.cells[ri].map(([lbl,why])=>`
          <div class="mx-cell mx-${lbl.toLowerCase()}"><div class="mx-lbl">${lbl}</div><div class="mx-why">${why}</div></div>`).join("")}`).join("")}
    </div>
  </div>
  <div class="card"><h3>Stop Loss Rules for Options</h3>
    <div class="grid2">
      <div class="ok-box mb0"><h3>Stock-based stop (preferred)</h3>
        <p class="small">Set the alert on the <b>underlying</b> price level, exit the option manually when it triggers.
        Your thesis is about the stock; let the stock tell you when it's dead. Option prices wiggle too much to trust alone.</p></div>
      <div class="conf-zone"><b>Stop-limit on the option</b>
        <p class="small muted" style="margin-top:4px">Paid $X → stop trigger at <b>50%</b> of X → limit at <b>45%</b> of X.
        The 5% gap gives the order room to actually fill on the way down.</p></div>
    </div>
    <div class="danger-box" style="margin:14px 0 0"><h3>Never use a stop-market on options</h3>
      <p class="small">Option bid/ask spreads gap wide the instant things move fast — exactly when stops trigger.
      A stop-market sells at <b>whatever the bid is</b>, and in a fast tape that can be 30% below your trigger. Stop-limit or stock-based alert, always.</p></div>
  </div>
  <div class="card"><h3>Scale-Out Plan</h3>
    ${[
      ["+30–40%","Sell 1/3","Pay yourself first. The trade now owes you nothing."],
      ["+75–100%","Sell another 1/3, move stop to break-even","Worst case from here is a scratch. You cannot lose on this trade anymore."],
      ["+150%+","Let the last 1/3 run","House money. This is the piece that pays for the losers — give it room."]
    ].map(([lvl,act,why])=>`
      <div class="lvl-row">
        <span class="lvl-px pos" style="width:90px">${lvl}</span>
        <span class="lvl-name" style="width:300px">${act}</span>
        <span class="lvl-note">${why}</span>
      </div>`).join("")}
  </div>
  <div class="${earnWarn?"danger-box":"drill"}"><h3>IV Crush Warning</h3>
    <p class="small">Check the earnings date <b>before</b> choosing DTE. If earnings land inside your DTE window → skip the trade or cut size hard.
    Never buy ATM options into earnings when IVR is already elevated — the post-print IV crush can erase a correct directional call entirely.</p>
    <p class="small" style="margin-top:8px"><b>${state.ticker}:</b> ${
      t.earningsDays==null ? "No earnings risk (ETF / none scheduled)." :
      earnWarn ? `⚠ Earnings in ~${t.earningsDays} days — INSIDE a 21 DTE window. Use ≤${Math.max(t.earningsDays-2,3)} DTE, cut size, or skip.` :
      `Earnings in ~${t.earningsDays} days — outside the 21 DTE window. Clear.`}</p>
  </div>`;
}

/* ================= MAIN RENDER ================= */
function renderMain(){
  const tab = state.tab[state.mode];
  let html = "";
  if(state.mode==="day"){
    if(tab==="eod") html = dayEodTab();
    else if(tab==="prep") html = dayPrepTab();
    else if(tab==="scen") html = dayScenTab();
    else if(tab==="log") html = dayLogTab();
    else html = rulesTab("day-rules", DAY_RULE_CATS, DAY_TRUTHS);
  } else {
    if(tab==="eod") html = swingEodTab();
    else if(tab==="prep") html = swingPrepTab();
    else if(tab==="scen") html = swingScenTab();
    else if(tab==="options") html = swingOptionsTab();
    else html = rulesTab("swing-rules", SWING_RULE_CATS, SWING_TRUTHS);
  }
  $("#content").innerHTML = html;
}

function renderHeader(){
  document.body.className = state.mode;
  $("#btnDay").className = "mode-btn"+(state.mode==="day"?" active-day":"");
  $("#btnSwing").className = "mode-btn"+(state.mode==="swing"?" active-swing":"");
  const pnl = sessionPnl();
  const b = $("#pnlBadge");
  b.textContent = money(pnl);
  b.className = "pnl-badge "+(pnl>=0?"pnl-pos":"pnl-neg");
}

function renderAll(){ renderHeader(); renderSidebar(); renderTabs(); renderMain(); }

/* ================= EXPORT ================= */
function exportTxt(){
  const L = [];
  const line = "=".repeat(58);
  L.push("TRADE JOURNAL EXPORT", new Date().toLocaleString(), line, "");
  L.push("MARKET PULSE");
  pulse.forEach(p=>L.push(`  ${p.sym}: ${sign(p.chg)}%  ${p.note}`));
  L.push("", line);
  Object.keys(tickers).forEach(sym=>{
    const t = tickers[sym], c = chgOf(t);
    L.push("", `TICKER: ${sym}   close ${fmt(t.close)} (${sign(c.p)}%)  bias: ${t.bias.toUpperCase()}`);
    L.push(`  -- Day trade data --`);
    L.push(`  ORH ${fmt(t.orHigh)} | ORL ${fmt(t.orLow)} | OR Mid ${fmt(t.orMid)} | VWAP ${fmt(t.vwap)}`);
    L.push(`  Day H/L ${fmt(t.dayHigh)}/${fmt(t.dayLow)} | RSI 5m ${t.rsi5m} | Vol ratio ${fmt(t.volRatio)}x`);
    L.push(`  VWAP vs OR Mid: ${t.vwap>=t.orMid?"BULLISH":"BEARISH"} lean`);
    L.push(`  -- Swing data --`);
    L.push(`  MA20 ${fmt(t.ma20)} (${t.close>=t.ma20?"above":"below"}) | MA50 ${fmt(t.ma50)} (${t.close>=t.ma50?"above":"below"})`);
    L.push(`  Daily RSI ${t.rsiDaily} (${rsiZone(t.rsiDaily)}) | MACD ${t.macd}`);
    L.push(`  IVR ${t.ivr} -> ${ivrLabel(t.ivr)} | Structure ${t.structure} | Weekly trend ${t.weeklyTrend}`);
    L.push(`  Sector ${t.sectorEtf} ${sign(t.sectorChg)}% | RS vs SPY: ${t.rs} | Confidence ${t.confidence}%`);
    L.push(`  Prior day H/L ${fmt(t.priorDayHigh)}/${fmt(t.priorDayLow)} | Prior week H/L ${fmt(t.priorWeekHigh)}/${fmt(t.priorWeekLow)}`);
  });
  L.push("", line, "", "TRADE LOG (DAY)");
  if(trades.length){
    trades.forEach(tr=>{
      L.push(`  ${tr.time}  ${tr.dir}  ${fmt(tr.entry)} -> ${fmt(tr.exit)}  x${tr.size}  P&L ${money(tradePnl(tr))}  [${tr.setup}]  plan:${tr.followedPlan?"YES":"NO"}${tr.mistake?"  NOTE: "+tr.mistake:""}`);
    });
    L.push(`  NET: ${money(sessionPnl())}  |  Win rate ${fmt(winRate(),0)}%`);
  } else L.push("  (no trades)");
  L.push("", "ALERTS");
  alerts.forEach(a=>L.push(`  ${a.ticker} @ ${fmt(a.price)}  ${a.note}`));
  L.push("", line, "", "CHECKLIST PROGRESS");
  Object.keys(CHECKLISTS).forEach(id=>{
    L.push(`  ${id}: ${checked(id)}/${CHECKLISTS[id].length}`);
  });
  L.push("", "NOTES");
  const NN = {dayBest:"Best trade",dayWorst:"Worst trade",dayRule:"Rule broken",dayFix:"Fix tomorrow",
    dayEmotion:"Emotional state",swingObs:"Swing observation",swingLesson:"Swing lesson",
    swingPlan:"Swing game plan",swingPrep:"Swing prep notes"};
  Object.keys(NN).forEach(k=>{ if(state.notes[k]) L.push(`  ${NN[k]}: ${state.notes[k]}`); });
  L.push("", "-- end --");
  const blob = new Blob([L.join("\n")], {type:"text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "trade-journal-"+new Date().toISOString().slice(0,10)+".txt";
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ================= EVENTS ================= */
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act;

  if(act==="mode"){ state.mode = el.dataset.mode; renderAll(); }
  else if(act==="tab"){ state.tab[state.mode] = el.dataset.tab; renderTabs(); renderMain(); }
  else if(act==="select"){ state.ticker = el.dataset.tick; renderSidebar(); renderMain(); }
  else if(act==="check"){
    const list = el.dataset.list, idx = el.dataset.idx;
    state.checks[list] = state.checks[list]||{};
    state.checks[list][idx] = !state.checks[list][idx];
    el.classList.toggle("done", !!state.checks[list][idx]);
    el.querySelector(".ck-box").textContent = state.checks[list][idx] ? "✓" : "";
    updateChecklistUI(list);
  }
  else if(act==="addTicker"){
    const sym = (prompt("Ticker symbol:")||"").trim().toUpperCase();
    if(!sym) return;
    const px = parseFloat(prompt("Closing price:"));
    if(!isFinite(px) || px<=0) return alert("Invalid price.");
    if(!tickers[sym]){
      tickers[sym] = {
        close:px, prevClose:px, dayHigh:px*1.01, dayLow:px*0.99,
        orHigh:px*1.008, orLow:px*0.992, vwap:px, orMid:px,
        ma20:px, ma50:px*0.97, rsi5m:50, rsiDaily:50,
        macd:"flat histogram", volRatio:1.0, vol:"—", avgVol:"—",
        ivr:40, structure:"HH/HL", weeklyTrend:"neutral",
        bias:"neutral", sectorEtf:"SPY", sectorChg:-0.85,
        rs:"neutral", priorDayHigh:px*1.015, priorDayLow:px*0.985, confidence:50,
        pmHigh:px*1.005, pmLow:px*0.995, priorWeekHigh:px*1.03, priorWeekLow:px*0.97,
        wk52High:px*1.4, wk52Low:px*0.6, earningsDays:null
      };
    } else tickers[sym].close = px;
    state.ticker = sym;
    renderAll();
  }
  else if(act==="pulse"){
    const i = +el.dataset.idx, p = pulse[i];
    const chg = parseFloat(prompt(`${p.sym} % change:`, p.chg));
    if(isFinite(chg)) p.chg = chg;
    const note = prompt(`${p.sym} note:`, p.note);
    if(note!==null) p.note = note.trim();
    renderSidebar();
  }
  else if(act==="addAlert"){
    const price = parseFloat(prompt(`Alert price for ${state.ticker}:`));
    if(!isFinite(price)) return;
    const note = (prompt("Note for this alert:")||"").trim();
    alerts.push({ticker:state.ticker, price, note});
    renderMain();
  }
  else if(act==="delAlert"){ alerts.splice(+el.dataset.idx,1); renderMain(); }
  else if(act==="delTrade"){ trades.splice(+el.dataset.idx,1); renderHeader(); renderSidebar(); renderMain(); }
  else if(act==="addTrade"){
    const g = id=>document.getElementById(id);
    const entry = parseFloat(g("f-entry").value), exit = parseFloat(g("f-exit").value), size = parseInt(g("f-size").value,10);
    if(!isFinite(entry)||!isFinite(exit)||!isFinite(size)||size<=0) return alert("Entry, exit and size are required.");
    trades.push({
      time:g("f-time").value.trim()||"—", dir:g("f-dir").value,
      entry, exit, size,
      result:g("f-result").value, setup:g("f-setup").value.trim()||"—",
      followedPlan:g("f-plan").value==="yes", mistake:g("f-mistake").value.trim()
    });
    renderHeader(); renderSidebar(); renderMain();
  }
  else if(act==="export"){ exportTxt(); }
});

document.addEventListener("input", e=>{
  const k = e.target.dataset && e.target.dataset.note;
  if(k) state.notes[k] = e.target.value;
});
document.addEventListener("change", e=>{
  const k = e.target.dataset && e.target.dataset.note;
  if(k) state.notes[k] = e.target.value;
});

/* clock */
function tick(){
  $("#clock").textContent = new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});
}
setInterval(tick,1000); tick();

renderAll();
</script>
