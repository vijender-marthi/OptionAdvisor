<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark rounded square background -->
  <rect width="32" height="32" rx="7" fill="#0f0f13"/>

  <!-- Violet glow ring -->
  <rect width="32" height="32" rx="7" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.6"/>

  <!-- Candlestick chart — 3 bars -->
  <!-- Left bar: red/bearish -->
  <rect x="5" y="16" width="3.5" height="9" rx="1" fill="#ef4444" opacity="0.85"/>
  <line x1="6.75" y1="13" x2="6.75" y2="16" stroke="#ef4444" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <line x1="6.75" y1="25" x2="6.75" y2="27.5" stroke="#ef4444" stroke-width="1" stroke-linecap="round" opacity="0.7"/>

  <!-- Middle bar: neutral/small -->
  <rect x="12.25" y="13.5" width="3.5" height="7" rx="1" fill="#a78bfa" opacity="0.85"/>
  <line x1="14" y1="11" x2="14" y2="13.5" stroke="#a78bfa" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <line x1="14" y1="20.5" x2="14" y2="23" stroke="#a78bfa" stroke-width="1" stroke-linecap="round" opacity="0.7"/>

  <!-- Right bar: green/bullish tall -->
  <rect x="19.5" y="9" width="3.5" height="13" rx="1" fill="#10b981" opacity="0.9"/>
  <line x1="21.25" y1="6" x2="21.25" y2="9" stroke="#10b981" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <line x1="21.25" y1="22" x2="21.25" y2="25" stroke="#10b981" stroke-width="1" stroke-linecap="round" opacity="0.7"/>

  <!-- Emerald GO dot -->
  <circle cx="26.5" cy="6.5" r="3" fill="#10b981"/>
  <circle cx="26.5" cy="6.5" r="1.5" fill="white"/>
</svg>
