name: Push local data to production

"on":
  workflow_dispatch: {}

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Import data to production
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            B64='${{ secrets.PROD_IMPORT_DATA }}'
            echo "$B64" | base64 -d > /tmp/import_data.json
            echo '' | base64 -d | python3
