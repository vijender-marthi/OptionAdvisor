name: Push local data to production

on: workflow_dispatch

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Import data to production
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            DB=/mnt/optionadvisor-data/option_advisor.sqlite3

            python3 <<'PYEOF'
import sqlite3, json, base64

DATA = ""

decoded = json.loads(base64.b64decode(DATA))
db = "/mnt/optionadvisor-data/option_advisor.sqlite3"

conn = sqlite3.connect(db)
conn.execute("UPDATE user_state SET portfolio_json = ?, my_tickers_json = ?, day_trade_watchlist_json = ?, updated_at = ? WHERE email = ?", (
    json.dumps(decoded["portfolio"]),
    json.dumps(decoded["my_tickers"]),
    json.dumps(decoded["day_trade_watchlist"]),
    __import__('datetime').datetime.utcnow().isoformat(),
    "vijender.marthi@gmail.com"
))
conn.execute("DELETE FROM active_trades WHERE email = ?", ("vijender.marthi@gmail.com",))
conn.commit()

r = conn.execute("SELECT portfolio_json, my_tickers_json FROM user_state WHERE email = ?", ("vijender.marthi@gmail.com",)).fetchone()
p = len(json.loads(r[0]))
t = len(json.loads(r[1]))
conn.close()
print(f"OK: {p} positions, {t} tickers imported to production")
PYEOF
