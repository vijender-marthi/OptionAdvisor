name: Engine Validation

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  engine-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python deps
        run: |
          cd backend
          pip install -r requirements.txt 2>/dev/null || pip install pydantic python-dotenv pyjwt requests pandas

      - name: Run engine regression
        run: |
          cd backend
          python3 tests/run_engine_regression.py

      - name: Backend syntax check
        run: |
          cd backend
          python3 -m py_compile main.py
          python3 -m py_compile storage.py
          python3 -m py_compile decision_resolver/resolver.py

      - name: Run backend tests
        run: |
          cd backend
          python3 -m unittest discover -s tests -t .

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: |
          cd frontend
          npm ci

      - name: TypeScript typecheck
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Vite build
        run: |
          cd frontend
          npx vite build
